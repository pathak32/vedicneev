name: Publish scheduled LinkedIn posts

# Vercel's Hobby plan only allows one cron run per day, so publishing is
# driven from here. GitHub's scheduler can start a run hours late, so this
# runs hourly rather than only at the two slot times (9:00 AM and 5:00 PM
# IST): the endpoint posts at most one due block per call and does nothing
# if no block's scheduledFor time has arrived, so extra runs are harmless
# and a delayed slot is picked up by the next run.
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Call publish-linkedin cron endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://www.vedicneev.com/api/cron/publish-linkedin"
